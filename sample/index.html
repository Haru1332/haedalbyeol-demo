<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>풀이 예시 · 해·달·별</title>
<!-- 예전 주소(sample/?id=…)로 온 손님을 메인 안 예시 화면(?sample=…)으로. 2026-10-25 예시를 메인 안으로 옮김(음악이 끊기지 않게) -->
<script>
  const q = new URLSearchParams(location.search), id = q.get('id'); q.delete('id'); if (id) q.set('sample', id);
  location.replace('../' + (q.toString() ? '?' + q : ''));
</script>
</head>
<body><p><a href="../">해·달·별로 가기</a></p></body>
</html>
